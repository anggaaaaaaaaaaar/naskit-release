<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t">
  <title id="t">NASKit: NAS untuk rumah dan kantor kecil dari mini PC atau PC bekas</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001219"/>
      <stop offset="1" stop-color="#003641"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(80 92) scale(2)">
      <rect width="48" height="48" rx="12" fill="#001219" stroke="#0a9396" stroke-width="1"/>
